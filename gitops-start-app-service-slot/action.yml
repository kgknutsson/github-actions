name: Start App Service deployment slot
description: Start a slot and wait until Azure reports Running.
inputs:
  app_name:
    description: App Service name
    required: true
  resource_group:
    description: Resource group name
    required: true
  slot_name:
    description: Deployment slot name
    required: true
runs:
  using: composite
  steps:
    - name: Start slot and wait for Running state
      shell: bash
      env:
        APP_NAME: ${{ inputs.app_name }}
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        SLOT_NAME: ${{ inputs.slot_name }}
      run: |
        set -euo pipefail
        error_file="$(mktemp)"
        trap 'rm -f "$error_file"' EXIT

        if ! az webapp start --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" 2>"$error_file"; then
          echo "::error::Failed to start slot '$SLOT_NAME' for app '$APP_NAME'"
          cat "$error_file"
          exit 1
        fi

        for attempt in $(seq 1 12); do
          if ! slot_state=$(az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --slot "$SLOT_NAME" --query state -o tsv 2>"$error_file"); then
            echo "::error::Failed to query slot '$SLOT_NAME' state after the start request"
            cat "$error_file"
            exit 1
          fi
          if [ "$slot_state" = "Running" ]; then
            echo "Slot '$SLOT_NAME' for app '$APP_NAME' started successfully"
            exit 0
          fi
          sleep 10
        done

        echo "::error::Slot '$SLOT_NAME' for app '$APP_NAME' did not reach Running state after the start request"
        exit 1
